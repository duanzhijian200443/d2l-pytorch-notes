name: Sync study log 6.3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-study-log-6-3.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and commit study log
        shell: bash
        run: |
          printf '%s' '' | base64 -d | python
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sync-study-log-6-3.yml
          git add study_log.md
          git commit -m 'docs: [6.3] 更新填充和步幅学习日志'
          git push origin HEAD:main
